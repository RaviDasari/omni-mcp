name: Bug report
description: Report a problem with omni-mcp
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: omni-mcp version
      placeholder: e.g. 0.1.0 or npx omni-mcp --version
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 20.11.0
